# general settings
name: SMoE_x2
model_type: SRModel
scale: 2
num_gpu: 1
manual_seed: 10

datasets:
  test_1:  # the 1st test dataset
    name: AID_test
    type: PairedImageDataset
    dataroot_gt: /AID/test/HR
    dataroot_lq: /AID/test/LR/x2
    filename_tmpl: '{}_x2'
    io_backend:
      type: disk

  test_2:  # the 2nd test dataset
    name: UCMerced
    type: PairedImageDataset
    dataroot_gt: /UCMerced_LandUse/UCMerced_LandUse/test/HR
    dataroot_lq: /UCMerced_LandUse/UCMerced_LandUse/test/LR/x2
    filename_tmpl: '{}_x2'
    io_backend:
      type: disk
