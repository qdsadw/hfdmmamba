network_g:
    type: wavelet27
    scale: 2
    in_chans: 3
    num_experts: 3
    img_range: 1.0
    num_layers: 8
    embedding_dim: 48
    use_shuffle: True
    lr_space: exp
    topk: 1
    recursive: 1
    d_state: 10
# path
path:
  pretrain_network_g: /home/waas/MambaIR-main/experiments/SMoE_X2/models/net_g_latest.pth
  strict_load_g: true

# validation settings
val:
  save_img: false
  suffix: ~  # add suffix to saved images, if None, use exp name

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 2
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 2
      test_y_channel: true
